<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Keepscan</title>
<meta name="description" content="{{ site.description }}">
<style>
:root{--bg:#fff;--fg:#1c1c24;--muted:#5b5d6b;--accent:#4338CA;--line:#e6e6ef}
@media (prefers-color-scheme:dark){:root{--bg:#111218;--fg:#ececf3;--muted:#a3a5b5;--accent:#8B8CFF;--line:#2a2b36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header,main,footer{max-width:720px;margin:0 auto;padding:0 20px}
header{display:flex;gap:18px;align-items:center;padding-top:28px;padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a.brand{font-weight:700;font-size:20px;color:var(--fg);text-decoration:none;margin-right:auto}
header nav a{color:var(--muted);text-decoration:none;margin-left:16px;font-size:15px}
header nav a:first-child{margin-left:0}
main{padding-top:24px;padding-bottom:40px}
a{color:var(--accent)}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px;padding-bottom:32px}
</style>
</head>
<body>
<header><a class="brand" href="{{ '/' | relative_url }}">Keepscan</a>
<nav><a href="{{ '/support/' | relative_url }}">Support</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="{{ '/terms/' | relative_url }}">Terms</a></nav></header>
<main>{{ content }}</main>
<footer>© Baki Uçan · <a href="mailto:ucnllc@gmail.com">ucnllc@gmail.com</a></footer>
</body>
</html>
